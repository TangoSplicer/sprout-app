plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}
def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

android {
    namespace "com.sproutapp.sprout"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs += 'src/main/jniLibs'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.sproutapp.sprout"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Security: Enable strict mode
        multiDexEnabled true
        
        // Security: Obfuscation is configured in buildTypes
        
        // Security: Network security
        manifestPlaceholders = [
            usesCleartextTraffic: 'false',
            networkSecurityConfig: '@xml/network_security_config'
        ]
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Security: Enable bundletool for optimized APKs
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

if (releaseRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException('A release build requires android/app/key.properties and a signing keystore.')
}

flutter {
    source '../..'
}

// The compiler is loaded through Dart FFI at runtime, so its shared libraries
// must be generated and copied into src/main/jniLibs before every APK build.
def buildSproutNativeLibraries = tasks.register('buildSproutNativeLibraries', Exec) {
    group = 'build'
    description = 'Builds and packages Rust Sprout compiler libraries for Android ABIs.'
    workingDir file('../../..')
    commandLine 'bash', file('../../../scripts/build_android_native.sh').absolutePath
}

tasks.named('preBuild').configure {
    dependsOn(buildSproutNativeLibraries)
}

dependencies {
    // Security: Keep dependencies updated
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Security: Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Security: Encrypted preferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Sprout Lens: real device camera capture and Google barcode/QR scanning.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}