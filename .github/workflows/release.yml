name: Signed Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  NDK_VERSION: 'r26d'

jobs:
  security-audit:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit Rust dependencies
        working-directory: rust/sprout_compiler
        run: cargo audit
      - name: Check for credential-like literals
        run: |
          ! git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN( [A-Z]+)? PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,})' -- '*.dart' '*.rs' '*.gradle' '*.yml' '*.yaml'

  build:
    name: Build, test, and sign Android artifacts
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt,clippy
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: sprout_app_flutter
        run: flutter pub get
      - name: Run Flutter quality checks
        working-directory: sprout_app_flutter
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test test
      - name: Run Rust quality checks
        working-directory: rust/sprout_compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Build Rust native libraries
        run: |
          cargo install cargo-ndk --locked
          bash scripts/build_android_native.sh
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_STORE_PASS"
          test -n "$KEYSTORE_KEY_PASS"
          test -n "$KEYSTORE_KEY_ALIAS"
          echo "$KEYSTORE_BASE64" | base64 --decode > sprout_app_flutter/android/app/sprout-release.keystore
          cat > sprout_app_flutter/android/app/key.properties <<EOF
          storePassword=$KEYSTORE_STORE_PASS
          keyPassword=$KEYSTORE_KEY_PASS
          keyAlias=$KEYSTORE_KEY_ALIAS
          storeFile=sprout-release.keystore
          EOF
          keytool -list -keystore sprout_app_flutter/android/app/sprout-release.keystore -storepass "$KEYSTORE_STORE_PASS" >/dev/null
      - name: Build signed Android artifacts
        working-directory: sprout_app_flutter
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
          sha256sum build/app/outputs/bundle/release/app-release.aab > build/app/outputs/bundle/release/app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: |
            sprout_app_flutter/build/app/outputs/flutter-apk/app-release.apk
            sprout_app_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
            sprout_app_flutter/build/app/outputs/bundle/release/app-release.aab
            sprout_app_flutter/build/app/outputs/bundle/release/app-release.aab.sha256
            sprout_app_flutter/build/symbols/
          retention-days: 90
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            sprout_app_flutter/build/app/outputs/flutter-apk/app-release.apk
            sprout_app_flutter/build/app/outputs/flutter-apk/app-release.apk.sha256
            sprout_app_flutter/build/app/outputs/bundle/release/app-release.aab
            sprout_app_flutter/build/app/outputs/bundle/release/app-release.aab.sha256
      - name: Remove signing files
        if: always()
        run: |
          rm -f sprout_app_flutter/android/app/sprout-release.keystore
          rm -f sprout_app_flutter/android/app/key.properties
