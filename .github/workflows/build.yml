name: Android Build

on:
  push:
    branches: [main, production-ready]
  pull_request:
    branches: [main, production-ready]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'
  NDK_VERSION: 'r26d'

jobs:
  verify-android:
    name: Verify Android application and native compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: dtolnay/rust-action@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt,clippy
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install Flutter dependencies
        working-directory: sprout_app_flutter
        run: flutter pub get
      - name: Verify Flutter source quality
        working-directory: sprout_app_flutter
        run: |
          dart format --set-exit-if-changed lib test
          flutter analyze --no-fatal-infos
          flutter test test
      - name: Verify Rust compiler quality
        working-directory: rust/sprout_compiler
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Build Rust native libraries
        run: |
          cargo install cargo-ndk --locked
          bash scripts/build_android_native.sh
      - name: Build Android debug artifacts
        working-directory: sprout_app_flutter
        run: |
          flutter build apk --debug
          flutter build appbundle --debug
      - name: Upload Android debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprout-android-debug-${{ github.sha }}
          path: |
            sprout_app_flutter/build/app/outputs/flutter-apk/app-debug.apk
            sprout_app_flutter/build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
